# Slack の「Create New App → From an app manifest」に貼り付けると、必要な権限とイベント設定が済んだアプリができます。
# WORKER_URL は scripts/setup.sh が実際の URL に置き換えて表示します。
display_information:
  name: LINE転送
  description: 自分宛ての DM・メンションを LINE に転送します
oauth_config:
  scopes:
    user:
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - users:read
      - channels:read
      - groups:read
      - im:read
      - mpim:read
settings:
  event_subscriptions:
    request_url: WORKER_URL/slack/events
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
