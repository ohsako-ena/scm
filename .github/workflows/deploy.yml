# Cloudflare Workers への配置と、秘密情報の登録を GitHub 上だけで行う。
# 使い方は docs/github-setup.md を参照。
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [claude/great-fermi-elc6yv]
    paths: [src/**, wrangler.toml, package.json, package-lock.json, .github/workflows/deploy.yml]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # 初期設定前の push では失敗扱いにせず、何もせず終える
      - name: Check Cloudflare token
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          msg="Secrets に CLOUDFLARE_API_TOKEN が登録されていません。docs/github-setup.md の手順2を確認してください。"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
          echo "::notice::$msg 配置はスキップしました。"

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.ready == 'true'

      - name: Test
        if: steps.check.outputs.ready == 'true'
        run: npm run typecheck && npm test

      - name: Deploy worker
        if: steps.check.outputs.ready == 'true'
        id: deploy
        env:
          SLACK_WATCH_CHANNELS: ${{ vars.SLACK_WATCH_CHANNELS }}
        run: |
          args=()
          if [ -n "$SLACK_WATCH_CHANNELS" ]; then args+=(--var "SLACK_WATCH_CHANNELS:$SLACK_WATCH_CHANNELS"); fi
          npx wrangler deploy "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -Eo 'https://[^ ]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # 登録されている Secrets だけを Worker に送る（未登録の項目は Worker 側の値をそのまま残す）
      - name: Upload secrets to worker
        if: steps.check.outputs.ready == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_TO: ${{ secrets.LINE_TO }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_MY_USER_ID: ${{ secrets.SLACK_MY_USER_ID }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          CHATWORK_WEBHOOK_TOKENS: ${{ secrets.CHATWORK_WEBHOOK_TOKENS }}
          CHATWORK_MY_ACCOUNT_ID: ${{ secrets.CHATWORK_MY_ACCOUNT_ID }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
        run: |
          file="$RUNNER_TEMP/secrets.json"
          node -e '
            const names = ["LINE_CHANNEL_ACCESS_TOKEN","LINE_CHANNEL_SECRET","LINE_TO","SLACK_SIGNING_SECRET","SLACK_MY_USER_ID","SLACK_TOKEN","CHATWORK_WEBHOOK_TOKENS","CHATWORK_MY_ACCOUNT_ID","CHATWORK_API_TOKEN"];
            const out = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n].trim()]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 });
            console.log("登録する項目: " + (Object.keys(out).join(", ") || "（なし）"));
          ' "$file"
          if [ "$(cat "$file")" != "{}" ]; then npx wrangler secret bulk "$file"; fi
          rm -f "$file"

      - name: Summary
        if: steps.check.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## 配置が完了しました"
            echo
            echo "Worker の URL: \`$URL\`"
            echo
            echo "| 貼る場所 | URL |"
            echo "| --- | --- |"
            echo "| LINE Developers → Messaging API 設定 → Webhook URL | \`$URL/line/webhook\` |"
            echo "| Slack → Event Subscriptions → Request URL | \`$URL/slack/events\` |"
            echo "| Chatwork → サービス連携 → Webhook → URL | \`$URL/chatwork/webhook\` |"
            echo
            echo "### Slack アプリ作成用 manifest（「From an app manifest」に貼り付け）"
            echo
            echo '```yaml'
            sed "s#WORKER_URL#${URL}#g" slack-app-manifest.yml | grep -v '^#'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
